<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — LeadForge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #1F4E79; --accent: #2E75B6; --light: #DEEBF6;
    --bg: #F7F9FC; --card: #FFFFFF; --text: #1F1F1F; --muted: #6B7280;
    --border: #E5E7EB; --success: #16A34A; --danger: #DC2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #F7F9FC 0%, var(--light) 100%); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }

  .nav { padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 800; color: var(--primary); }
  .logo span { color: var(--accent); }
  .nav a { color: var(--muted); font-size: 14px; font-weight: 500; }
  .nav a:hover { color: var(--primary); }

  .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .auth-card { background: white; border-radius: 16px; padding: 36px; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(31, 78, 121, 0.15), 0 4px 20px rgba(0,0,0,0.04); border: 1px solid var(--border); }
  .auth-card h1 { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 8px; text-align: center; letter-spacing: -0.5px; }
  .auth-card .sub { color: var(--muted); text-align: center; margin-bottom: 22px; font-size: 14px; }

  .perk-list { background: linear-gradient(135deg, var(--light), white); border: 1px solid #C7DEEF; border-radius: 10px; padding: 12px 16px; margin-bottom: 22px; display: flex; flex-direction: column; gap: 4px; }
  .perk-list .perk { font-size: 13px; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .btn-google {
    width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: white; color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px;
    transition: all 0.15s;
  }
  .btn-google:hover { border-color: var(--accent); background: #F9FAFB; transform: translateY(-1px); }
  .btn-google svg { width: 18px; height: 18px; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; transition: all 0.15s; }
  .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46, 117, 182, 0.15); }
  .form-group .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .btn-primary {
    width: 100%; padding: 13px 16px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--primary), var(--accent)); color: white;
    font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(31, 78, 121, 0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(31, 78, 121, 0.4); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .form-foot { text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
  .form-foot a { color: var(--accent); font-weight: 600; }
  .form-foot a:hover { text-decoration: underline; }

  .legal { text-align: center; font-size: 11px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
  .legal a { color: var(--accent); }

  .error { background: #FEE2E2; border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .error.show { display: block; }
  .success { background: #D1FAE5; border: 1px solid var(--success); color: #065F46; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .success.show { display: block; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="logo">Lead<span>Forge</span></a>
  <a href="/login">Already have an account? <strong>Sign in</strong></a>
</nav>

<div class="container">
  <div class="auth-card">
    <h1>Start free today</h1>
    <p class="sub">No credit card required</p>

    <div class="perk-list">
      <div class="perk">✓ 10 free credits on signup</div>
      <div class="perk">✓ All filters & countries unlocked</div>
      <div class="perk">✓ Credits never expire</div>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <button class="btn-google" onclick="signUpWithGoogle()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider">OR</div>

    <form id="signupForm" onsubmit="handleEmailSignup(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters" autocomplete="new-password" minlength="6" />
        <div class="hint">Minimum 6 characters</div>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Create free account</button>
    </form>

    <div class="form-foot">
      Already a member? <a href="/login">Sign in</a>
    </div>
    <div class="legal">
      By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
  </div>
</div>

<script>
  // ===== SUPABASE CONFIG =====
  const SUPABASE_URL = "https://wqzqzwswmflyuogdiprq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxenF6d3N3bWZseXVvZ2RpcHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzgyNTMsImV4cCI6MjA5NjA1NDI1M30.hd8vVO1zYgycvfrim9GQjIhXtqAsGvKvoKjm0s8NfNY";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // If already signed in, redirect to dashboard
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "/dashboard";
  })();

  function showError(msg) {
    const el = document.getElementById("errorBox");
    el.textContent = msg;
    el.classList.add("show");
    document.getElementById("successBox").classList.remove("show");
  }
  function showSuccess(msg) {
    const el = document.getElementById("successBox");
    el.textContent = msg;
    el.classList.add("show");
    document.getElementById("errorBox").classList.remove("show");
  }
  function clearMsgs() {
    document.getElementById("errorBox").classList.remove("show");
    document.getElementById("successBox").classList.remove("show");
  }

  async function handleEmailSignup(e) {
    e.preventDefault();
    clearMsgs();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: window.location.origin + "/dashboard" },
      });
      if (error) throw error;

      // Check if email confirmation is required
      if (data.session) {
        // Auto-signed in (email confirmation OFF in Supabase)
        showSuccess("✓ Account created! Redirecting to dashboard...");
        setTimeout(() => { window.location.href = "/dashboard"; }, 800);
      } else {
        // Email confirmation required
        showSuccess("✓ Almost done! Check your email to verify your account before signing in.");
        btn.textContent = "Check your email";
      }
    } catch (err) {
      showError(err.message || "Could not create account. Try again.");
      btn.disabled = false;
      btn.textContent = "Create free account";
    }
  }

  async function signUpWithGoogle() {
    clearMsgs();
    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/dashboard" },
      });
      if (error) throw error;
    } catch (err) {
      showError("Google sign-up failed: " + err.message);
    }
  }
</script>
</body>
</html>
