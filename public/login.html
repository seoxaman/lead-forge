<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — LeadForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #1F4E79;
    --accent: #2E75B6;
    --text: #1F2937;
    --muted: #6B7280;
    --border: #D1D5DB;
    --soft: #F9FAFB;
    --success: #10B981;
    --success-soft: #D1FAE5;
    --danger: #EF4444;
    --danger-soft: #FEE2E2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body { background: white; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  .top-nav { padding: 18px 24px; display: flex; justify-content: flex-end; }
  .top-nav a { color: var(--muted); font-size: 14px; font-weight: 500; text-decoration: none; }
  .top-nav a strong { color: var(--primary); font-weight: 700; }
  .top-nav a:hover strong { color: var(--accent); }

  .container { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 24px 24px 60px; }
  .auth-card { max-width: 440px; width: 100%; }

  .brand { text-align: center; margin-bottom: 36px; }
  .brand-logo { font-size: 38px; font-weight: 800; letter-spacing: -1.5px; color: var(--text); }
  .brand-logo span { color: var(--accent); }
  .brand-sub { margin-top: 10px; color: var(--muted); font-size: 15px; }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .form-group .label-row { display: flex; justify-content: space-between; align-items: center; }
  .form-group .label-row a { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 500; }
  .form-group .label-row a:hover { text-decoration: underline; }
  .form-group input { width: 100%; padding: 13px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; font-family: inherit; color: var(--text); background: white; transition: all 0.15s; }
  .form-group input::placeholder { color: #9CA3AF; }
  .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46, 117, 182, 0.15); }

  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 44px; }
  .eye-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; cursor: pointer; padding: 6px;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    transition: color 0.15s; border-radius: 4px;
  }
  .eye-toggle:hover { color: var(--text); }
  .eye-toggle svg { width: 18px; height: 18px; }

  .btn-primary {
    width: 100%; padding: 14px 16px; border-radius: 9px; border: none;
    background: var(--primary); color: white;
    font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.15s;
    font-family: inherit; margin-top: 6px;
  }
  .btn-primary:hover { background: #163C5E; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .btn-google {
    width: 100%; padding: 13px 16px; border-radius: 9px; border: 1px solid var(--border);
    background: white; color: var(--text); font-weight: 600; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 11px;
    transition: all 0.15s; font-family: inherit;
  }
  .btn-google:hover { background: var(--soft); border-color: #9CA3AF; }
  .btn-google svg { width: 19px; height: 19px; flex-shrink: 0; }

  .error { background: var(--danger-soft); border: 1px solid var(--danger); color: #991B1B; padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; display: none; line-height: 1.5; }
  .error.show { display: block; }
  .success { background: var(--success-soft); border: 1px solid var(--success); color: #065F46; padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; display: none; line-height: 1.5; }
  .success.show { display: block; }

  @media (max-width: 520px) {
    .top-nav { padding: 16px 16px; }
    .container { padding: 16px 18px 40px; }
    .brand-logo { font-size: 32px; }
    .brand-sub { font-size: 14px; }
    .brand { margin-bottom: 28px; }
    .form-group input { padding: 12px 14px; font-size: 16px; }
    .password-wrap input { padding-right: 44px; }
    .btn-primary, .btn-google { padding: 13px 16px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="/signup">Don't have an account? <strong>Sign up</strong></a>
</div>

<div class="container">
  <div class="auth-card">

    <div class="brand">
      <a href="/" style="text-decoration:none;"><div class="brand-logo">Lead<span>Forge</span></div></a>
      <div class="brand-sub">Welcome back</div>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <form id="loginForm" onsubmit="handleEmailLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
        </div>
        <div class="password-wrap">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="eye-toggle" onclick="togglePassword('password', this)" tabindex="-1" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
    </form>

    <div class="divider">OR</div>

    <button class="btn-google" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

  </div>
</div>

<script>
  // ===== SUPABASE CONFIG =====
  const SUPABASE_URL = "https://wqzqzwswmflyuogdiprq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxenF6d3N3bWZseXVvZ2RpcHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzgyNTMsImV4cCI6MjA5NjA1NDI1M30.hd8vVO1zYgycvfrim9GQjIhXtqAsGvKvoKjm0s8NfNY";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "/dashboard";
  })();

  function showError(msg) {
    const el = document.getElementById("errorBox");
    el.textContent = msg;
    el.classList.add("show");
    document.getElementById("successBox").classList.remove("show");
  }
  function showSuccess(msg) {
    const el = document.getElementById("successBox");
    el.textContent = msg;
    el.classList.add("show");
    document.getElementById("errorBox").classList.remove("show");
  }
  function clearMsgs() {
    document.getElementById("errorBox").classList.remove("show");
    document.getElementById("successBox").classList.remove("show");
  }

  function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const isHidden = field.type === "password";
    field.type = isHidden ? "text" : "password";
    btn.innerHTML = isHidden
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }

  async function handleEmailLogin(e) {
    e.preventDefault();
    clearMsgs();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      showSuccess("✓ Signed in! Redirecting...");
      setTimeout(() => { window.location.href = "/dashboard"; }, 500);
    } catch (err) {
      const msg = (err.message || "").toLowerCase();
      if (msg.includes("email not confirmed")) {
        showError("Email not verified. Check your inbox for the verification link, or contact support if it didn't arrive.");
      } else if (msg.includes("invalid")) {
        showError("Invalid email or password. Please try again.");
      } else {
        showError(err.message || "Could not sign in.");
      }
      btn.disabled = false;
      btn.textContent = "Sign In";
    }
  }

  async function signInWithGoogle() {
    clearMsgs();
    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/dashboard" },
      });
      if (error) throw error;
    } catch (err) {
      showError("Google sign-in failed: " + err.message);
    }
  }
</script>
</body>
</html>
